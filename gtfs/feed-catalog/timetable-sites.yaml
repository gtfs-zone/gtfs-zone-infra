# ── timetable-sites (Dagster code location) ───────────────────────────────────
# Builds the static timetable sites at sites.gtfs.zone. A second code location
# in feed-catalog's Dagster instance: the webserver and daemon are feed-catalog's,
# and runs share its Postgres run storage and its single-run queue, so the daily
# schedule (11:00 UTC) sits after the catalog run (09:00 UTC).
#
# With DefaultRunLauncher a run executes inside this pod, so it carries the
# instance config and the run storage credentials like feed-catalog-code. A run
# builds its shard of sites in TIMETABLE_SITES_WORKERS processes, each capped at
# TIMETABLE_SITES_WORKER_MEMORY bytes of address space, so the memory limit covers
# the workers plus the code server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timetable-sites-code
  namespace: gtfs
  labels:
    app: timetable-sites-code
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timetable-sites-code
  template:
    metadata:
      labels:
        app: timetable-sites-code
    spec:
      containers:
        - name: timetable-sites
          image: ghcr.io/gtfs-zone/gtfs-zone-timetable-sites
          command:
            - dagster
            - api
            - grpc
            - -h
            - 0.0.0.0
            - -p
            - "4000"
            - -m
            - gtfs_zone_timetable_sites.pipeline.definitions
          ports:
            - name: grpc
              containerPort: 4000
          env:
            - name: DAGSTER_HOME
              value: /app/dagster_home
            - name: POSTGRES_FEED_CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-feed-catalog
                  key: password
            - name: DATABASE_URL
              value: postgresql://feed_catalog:$(POSTGRES_FEED_CATALOG_PASSWORD)@postgres-rw:5432/feed_catalog
            # The public sites bucket, in R2 behind sites.gtfs.zone, with a
            # token scoped to that bucket.
            - name: S3_ENDPOINT
              value: https://58bb5ad547881e71cebb0516eaa25de8.r2.cloudflarestorage.com
            - name: S3_BUCKET
              value: gtfs-zone-sites
            - name: S3_REGION
              value: auto
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: TIMETABLE_SITES_R2_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: TIMETABLE_SITES_R2_SECRET_KEY
            - name: TIMETABLE_SITES_WORKERS
              value: "4"
            - name: TIMETABLE_SITES_WORKER_MEMORY
              value: "2500000000"
            # Heartbeat pushed once 95% of sites are built for the day.
            - name: GATUS_URL
              value: http://gatus:8080
            - name: GATUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GATUS_TIMETABLE_SITES_TOKEN
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 11Gi
          volumeMounts:
            - name: dagster-config
              mountPath: /app/dagster_home/dagster.yaml
              subPath: dagster.yaml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: dagster-config
          configMap:
            name: feed-catalog-dagster
---
apiVersion: v1
kind: Service
metadata:
  name: timetable-sites-code
  namespace: gtfs
spec:
  selector:
    app: timetable-sites-code
  ports:
    - name: grpc
      port: 4000
      targetPort: grpc

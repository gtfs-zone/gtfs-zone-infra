# ── feed-catalog (Dagster) ────────────────────────────────────────────────────
# The pipeline that inventories the world of GTFS: it ingests the Transitland
# Atlas DMFR corpus and the Mobility Database daily, checks whether each feed
# endpoint still answers, keeps the history in Postgres, and publishes the JSON
# artifacts consumers read from data.gtfs.zone.
#
# Three Deployments off one image, which is how Dagster is meant to be run:
#
#   feed-catalog-code       gRPC code server; the run itself executes here
#   feed-catalog-daemon     schedule ticks and the run queue
#   feed-catalog-webserver  the UI, behind oauth2-proxy-admin at dagster.gtfs.zone
#
# DAGSTER_HOME is /app/dagster_home because /app is root-owned and the image
# runs as `bridge`: the image creates and chowns exactly that directory. The
# instance config is mounted into it by subPath, so the directory itself stays
# writable. This is the same trap as static-importer-beat's --schedule flag, and it
# fails late and confusingly rather than at startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-catalog-code
  namespace: gtfs
  labels:
    app: feed-catalog-code
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feed-catalog-code
  template:
    metadata:
      labels:
        app: feed-catalog-code
    spec:
      containers:
        - name: feed-catalog
          image: ghcr.io/gtfs-zone/gtfs-zone-feed-catalog
          # The image's own CMD, spelled out because this is the pod where it
          # matters: the webserver and the daemon both override it.
          command:
            - dagster
            - api
            - grpc
            - -h
            - 0.0.0.0
            - -p
            - "4000"
            - -m
            - gtfs_zone_feed_catalog.definitions
          ports:
            - name: grpc
              containerPort: 4000
          env:
            - name: DAGSTER_HOME
              value: /app/dagster_home
            - name: POSTGRES_FEED_CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-feed-catalog
                  key: password
            - name: DATABASE_URL
              value: postgresql://feed_catalog:$(POSTGRES_FEED_CATALOG_PASSWORD)@postgres-rw:5432/feed_catalog
            # The public artifact bucket, in R2 behind data.gtfs.zone, with a
            # token scoped to that bucket.
            - name: S3_ENDPOINT
              value: https://58bb5ad547881e71cebb0516eaa25de8.r2.cloudflarestorage.com
            - name: S3_BUCKET
              value: gtfs-zone-data
            - name: S3_REGION
              value: auto
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: FEED_CATALOG_R2_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: FEED_CATALOG_R2_SECRET_KEY
            # A refresh token, exchanged for a short-lived access token at the
            # start of each run. Empty is not an error: the run then covers
            # Transitland and the curated set alone.
            - name: MOBILITY_DB_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: MOBILITY_DB_REFRESH_TOKEN
            # Heartbeat pushed after each publish; Gatus pages when it stops.
            - name: GATUS_URL
              value: http://gatus:8080
            - name: GATUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GATUS_FEED_CATALOG_TOKEN
          volumeMounts:
            - name: dagster-config
              mountPath: /app/dagster_home/dagster.yaml
              subPath: dagster.yaml
              readOnly: true
          # gRPC, so a TCP check is the whole check available without a probe
          # client. The code server binds only once the module imports, which
          # is the failure worth catching here.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: dagster-config
          configMap:
            name: feed-catalog-dagster
---
apiVersion: v1
kind: Service
metadata:
  name: feed-catalog-code
  namespace: gtfs
spec:
  selector:
    app: feed-catalog-code
  ports:
    - name: grpc
      port: 4000
      targetPort: grpc
---
# The daemon: schedule ticks and the run queue. replicas 1 and Recreate, never
# two: a second daemon submits the daily schedule a second time, the same
# reason static-importer-beat is pinned to one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-catalog-daemon
  namespace: gtfs
  labels:
    app: feed-catalog-daemon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: feed-catalog-daemon
  template:
    metadata:
      labels:
        app: feed-catalog-daemon
    spec:
      containers:
        - name: feed-catalog
          image: ghcr.io/gtfs-zone/gtfs-zone-feed-catalog
          command: ["dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml"]
          env:
            - name: DAGSTER_HOME
              value: /app/dagster_home
            - name: POSTGRES_FEED_CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-feed-catalog
                  key: password
            - name: DATABASE_URL
              value: postgresql://feed_catalog:$(POSTGRES_FEED_CATALOG_PASSWORD)@postgres-rw:5432/feed_catalog
          volumeMounts:
            - name: dagster-config
              mountPath: /app/dagster_home/dagster.yaml
              subPath: dagster.yaml
              readOnly: true
            - name: dagster-config
              mountPath: /app/dagster_home/workspace.yaml
              subPath: workspace.yaml
              readOnly: true
          # The daemon's own check: it fails while the heartbeat in run storage
          # is stale, which is exactly the silent failure mode - a daemon that
          # is up but has stopped ticking looks healthy to anything else.
          livenessProbe:
            exec:
              command: ["dagster-daemon", "liveness-check"]
            initialDelaySeconds: 60
            periodSeconds: 60
            # The CLI's own import takes ~3s; the 1s default kills a live daemon.
            timeoutSeconds: 15
      volumes:
        - name: dagster-config
          configMap:
            name: feed-catalog-dagster
---
# The UI. Public exposure is dagster.gtfs.zone, gated by oauth2-proxy-admin on
# the gtfs-admins group: this UI can launch runs and delete history, so it is
# not one of the ungated hosts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-catalog-webserver
  namespace: gtfs
  labels:
    app: feed-catalog-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feed-catalog-webserver
  template:
    metadata:
      labels:
        app: feed-catalog-webserver
    spec:
      containers:
        - name: feed-catalog
          image: ghcr.io/gtfs-zone/gtfs-zone-feed-catalog
          command:
            - dagster-webserver
            - -h
            - 0.0.0.0
            - -p
            - "3000"
            - -w
            - /app/dagster_home/workspace.yaml
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DAGSTER_HOME
              value: /app/dagster_home
            - name: POSTGRES_FEED_CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-feed-catalog
                  key: password
            - name: DATABASE_URL
              value: postgresql://feed_catalog:$(POSTGRES_FEED_CATALOG_PASSWORD)@postgres-rw:5432/feed_catalog
          volumeMounts:
            - name: dagster-config
              mountPath: /app/dagster_home/dagster.yaml
              subPath: dagster.yaml
              readOnly: true
            - name: dagster-config
              mountPath: /app/dagster_home/workspace.yaml
              subPath: workspace.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /server_info
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /server_info
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
      volumes:
        - name: dagster-config
          configMap:
            name: feed-catalog-dagster
---
apiVersion: v1
kind: Service
metadata:
  name: feed-catalog-webserver
  namespace: gtfs
spec:
  selector:
    app: feed-catalog-webserver
  ports:
    - name: http
      port: 3000
      targetPort: http

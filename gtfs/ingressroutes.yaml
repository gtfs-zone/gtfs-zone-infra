# ── IngressRoutes ─────────────────────────────────────────────────────────────
# Replaces the TF Traefik container labels. One IngressRoute per host on the
# `websecure` entrypoint (host :8443 via ServiceLB), all terminating with the
# cert-manager wildcard Secret `gtfs-zone-tls`.
#
# Every route carries `external-dns.alpha.kubernetes.io/target: <server_ip>` so
# external-dns creates the matching Porkbun record; this is what retired dns.tf.
#
# Auth: the two oauth2 Middlewares (oauth2-proxy.yaml) replace the TF ForwardAuth
# labels. Public by design: rt (the GTFS-RT feed), status (the Gatus status page),
# id + auth (the login flow itself), data (feed-catalog's published artifacts),
# sites (timetable-sites' timetable sites)
# and both Traccar routes. The gated hosts (manage.rt, dagster) each also serve
# /robots.txt unauthenticated.
#
# TLS reaches this cluster untouched: home-docker's Traefik does SNI passthrough
# for *.gtfs.zone, so k3s owns gtfs.zone certificates end to end.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rt
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`rt.gtfs.zone`)
      kind: Rule
      services:
        - name: gtfs-api
          port: 8000
  tls:
    secretName: gtfs-zone-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: manage-rt
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    # robots.txt must bypass ForwardAuth: crawlers have no session, and a 401
    # here reads as "no robots.txt" and lets them crawl every gated URL.
    - match: Host(`manage.rt.gtfs.zone`) && Path(`/robots.txt`)
      kind: Rule
      services:
        - name: rt-manager
          namespace: sites
          port: 80
    # oauth2-proxy's own endpoints (sign_in page, /static assets, /callback) must
    # bypass ForwardAuth, otherwise the sign-in page's CSS/JS re-enter the auth
    # chain and come back as 401 HTML. Traefik prefers the longer rule.
    - match: Host(`manage.rt.gtfs.zone`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: oauth2-proxy
          port: 4180
    # rt-manager's JSON API, same-origin against rt-api's gtfs-manager.
    - match: Host(`manage.rt.gtfs.zone`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: oauth2-errors
        - name: oauth2-proxy
      services:
        - name: gtfs-manager
          port: 8001
    - match: Host(`manage.rt.gtfs.zone`)
      kind: Rule
      middlewares:
        - name: oauth2-errors
        - name: oauth2-proxy
      services:
        - name: rt-manager
          namespace: sites
          port: 80
  tls:
    secretName: gtfs-zone-tls
---
# Keycloak, on its own host (id.gtfs.zone). Public by design: this is the
# login flow itself. Covered by the *.gtfs.zone wildcard in gtfs-zone-tls.
#
# Keycloak has no "default realm": it hardcodes `/` -> `/admin/` ->
# `/admin/master/console/`, which lands every visitor on the console of the
# built-in server-admin realm, where none of our users have an account. The two
# redirects below land people in the `gtfs` realm instead. `master` is not
# deletable and is still reachable at its full URL; it stays break-glass.
#
# 302, not 301: a permanent redirect on a bare hostname is cached by browsers
# indefinitely and is painful to walk back.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-root-redirect
  namespace: gtfs
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://id.gtfs.zone/realms/gtfs/account/"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-admin-redirect
  namespace: gtfs
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://id.gtfs.zone/admin/gtfs/console/"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    # Explicit priorities: Traefik otherwise ranks by rule length, and these two
    # must outrank the catch-all Host rule they share a host with.
    - match: Host(`id.gtfs.zone`) && Path(`/`)
      kind: Rule
      priority: 100
      middlewares:
        - name: keycloak-root-redirect
      services:
        - name: keycloak
          port: 8080
    - match: Host(`id.gtfs.zone`) && (Path(`/admin`) || Path(`/admin/`))
      kind: Rule
      priority: 100
      middlewares:
        - name: keycloak-admin-redirect
      services:
        - name: keycloak
          port: 8080
    - match: Host(`id.gtfs.zone`)
      kind: Rule
      priority: 10
      services:
        - name: keycloak
          port: 8080
  tls:
    secretName: gtfs-zone-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`auth.gtfs.zone`)
      kind: Rule
      services:
        - name: oauth2-proxy
          port: 4180
  tls:
    secretName: gtfs-zone-tls
---
# Gatus, intentionally unauthenticated: the status page is the whole UI, and it is
# public by design. There is no separate dashboard host any more (uptime.gtfs.zone
# went away with Uptime Kuma); the check set lives in gtfs/gatus/config.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: status
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`status.gtfs.zone`)
      kind: Rule
      services:
        - name: gatus
          port: 8080
  tls:
    secretName: gtfs-zone-tls
---
# Traccar: one hostname, split by path, so drivers get no second confusable host.
#
#   /osmand  → :5055  phone reports (Traccar Client). Must stay unauthenticated:
#              a phone has no browser session; devices authenticate by uniqueId.
#   /*       → :8082  web console + REST API, which does its own Keycloak OIDC
#              login and so is deliberately NOT behind oauth2-proxy.
#
# No StripPrefix. Verified against traccar/traccar:6.14.5 that the osmand decoder
# ignores the request path entirely and reads only the query parameters: POSTs to
# `/osmand?id=...` and `/?id=...` both return 200 and store the position. Dropping
# the middleware keeps the phone-facing path the simplest thing that works.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traccar
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`traccar.gtfs.zone`) && PathPrefix(`/osmand`)
      kind: Rule
      services:
        - name: traccar-osmand
          port: 5055
    - match: Host(`traccar.gtfs.zone`)
      kind: Rule
      services:
        - name: traccar
          port: 8082
  tls:
    secretName: gtfs-zone-tls
---
# The public artifact bucket, served by Garage's own s3_web endpoint rather than
# the S3 API: feed-catalog's JSON is meant to be fetched by a browser with no
# credentials. Garage picks the bucket from the Host header, matching it against
# the bucket's global alias, which is why the bucket is aliased literally
# `data.gtfs.zone`. Deliberately NO Host-rewrite middleware: rewriting the Host
# is rewriting the bucket name, and the answer is a 404 that never says why.
# Garage serves the JSON uncompressed, so Traefik compresses it on the way out.
# data-cors replaces Garage's reflected Access-Control-Allow-Origin with a
# constant `*`: Garage sends no `Vary: Origin`, so a copy cached by one gtfs.zone
# app would otherwise fail the CORS check in another.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: data
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`data.gtfs.zone`)
      kind: Rule
      middlewares:
        - name: data-cors
        - name: compress
      services:
        - name: garage
          port: 3902
  tls:
    secretName: gtfs-zone-tls
---
# timetable-sites' timetable sites, from the sites.gtfs.zone bucket over the same
# s3_web endpoint as data.gtfs.zone. Garage stores and serves the pages
# uncompressed, so Traefik compresses them on the way out.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sites
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`sites.gtfs.zone`)
      kind: Rule
      middlewares:
        - name: compress
      services:
        - name: garage
          port: 3902
  tls:
    secretName: gtfs-zone-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: gtfs
spec:
  compress:
    encodings: [zstd, br, gzip]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: data-cors
  namespace: gtfs
spec:
  headers:
    customResponseHeaders:
      Access-Control-Allow-Origin: "*"
---
# Dagster's UI, behind the admin oauth2-proxy: it can launch runs and delete
# history, so unlike manage.rt it is gated on the gtfs-admins group.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dagster
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    # oauth2-proxy's built-in robots.txt (Disallow: /), past ForwardAuth for the
    # same reason as on manage.rt.
    - match: Host(`dagster.gtfs.zone`) && Path(`/robots.txt`)
      kind: Rule
      services:
        - name: oauth2-proxy-admin
          port: 4180
    # Unprotected and longer, so Traefik prefers it: the sign-in page's own CSS
    # and the /callback must not re-enter the auth chain, or they come back as
    # 401 HTML and the login never completes.
    - match: Host(`dagster.gtfs.zone`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: oauth2-proxy-admin
          port: 4180
    - match: Host(`dagster.gtfs.zone`)
      kind: Rule
      middlewares:
        - name: oauth2-admin-errors
        - name: oauth2-admin
      services:
        - name: feed-catalog-webserver
          port: 3000
  tls:
    secretName: gtfs-zone-tls

# gtfs stack: Kustomize root assembled by the `gtfs` ArgoCD Application. The
# `secrets` base contains *.enc.yaml, so ArgoCD routes the whole tree through the
# KSOPS CMP (`kustomize build --enable-alpha-plugins --enable-exec`).
#
# Phase 5 wired the stateful layer (Postgres + Redis) + secrets. Phase 6 adds the
# application layer (Keycloak, oauth2-proxy, rt-api + migrate hook, celery, uptime-kuma).
# Phase 6a adds the ingest layer (Traccar, rt-traccar-receiver, rt-pollers ×2).
# The IngressRoutes that expose these are added in Phase 7.
#
# The list below is flat rather than indented because `kustomize edit set image`
# rewrites this whole file, and feed-catalog's CI runs it here on every push.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- secrets
- postgres-cluster.yaml
- redis.yaml
- garage.yaml
- keycloak
- oauth2-proxy.yaml
- rt-api.yaml
- rt-api-migrate.yaml
- static-importer.yaml
- gatus
- traccar
- rt-traccar-receiver.yaml
- rt-delay-estimator.yaml
- rt-pollers.yaml
- feed-catalog
- feed-catalog-migrate.yaml
- ingressroutes.yaml
# Written by feed-catalog's CI after it pushes, so what is deployed is the
# digest of exactly what was built rather than a moving tag.
images:
- digest: sha256:81b3451d9113cfe3ada3a9201af61047e8e5e6c563be500f4cb1d0549c465e40
  name: ghcr.io/gtfs-zone/gtfs-zone-feed-catalog
  newName: ghcr.io/gtfs-zone/gtfs-zone-feed-catalog
- digest: sha256:8a289423e602332332f003444b404451ab16d0213eb46e7cc2f5b2caa878fe47
  name: ghcr.io/gtfs-zone/gtfs-zone-timetable-sites
  newName: ghcr.io/gtfs-zone/gtfs-zone-timetable-sites

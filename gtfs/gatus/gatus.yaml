# ── Gatus ─────────────────────────────────────────────────────────────────────
# Replaces Uptime Kuma. Kuma kept its entire configuration (monitors, status
# page, notifications) in a SQLite file with no config-as-code and no supported
# API, so none of it could live in this repo; it ran for weeks with zero monitors
# and no status page and nothing noticed. Gatus is configured by exactly one YAML
# file (config.yaml here), which is what makes status.gtfs.zone reconcilable.
#
# Alerts go to the same Telegram bot and chat as home-docker's Uptime Kuma, so
# gtfs.zone and kcfam.us page the same place.
#
# Storage is in-memory by design: history resets on restart, there is no PVC and
# no database. The status page shows the recent window, which is what a public
# page is for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gtfs
  labels:
    app: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: gatus
          image: twinproduction/gatus:v5.36.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
            # Telegram alerting. config.yaml refers to these as ${VAR}; Gatus
            # substitutes at load, so the bot token never enters the ConfigMap.
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: TELEGRAM_CHAT_ID
            # Bearer token feed-catalog pushes its publish heartbeat with.
            - name: GATUS_FEED_CATALOG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GATUS_FEED_CATALOG_TOKEN
            # Bearer token timetable-sites pushes its publish heartbeat with.
            - name: GATUS_TIMETABLE_SITES_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GATUS_TIMETABLE_SITES_TOKEN
            # Bearer token the rt-pollers push their upstream heartbeats with.
            - name: GATUS_POLLERS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GATUS_POLLERS_TOKEN
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: gatus-config
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: gtfs
spec:
  selector:
    app: gatus
  ports:
    - name: http
      port: 8080
      targetPort: http

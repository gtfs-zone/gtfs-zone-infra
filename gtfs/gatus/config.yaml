# Gatus check set. This file IS the monitoring config: it is hash-suffixed into a
# ConfigMap, so editing it rolls the Deployment and the status page follows git.
#
# Public hostnames are checked by their real URL, not by Service DNS: the point is
# to exercise the whole path (Porkbun DNS, home-docker SNI passthrough, k3s
# Traefik, cert-manager TLS). Hairpin NAT out to 73.4.232.254 and back works from
# inside the cluster, verified.
storage:
  type: memory

# Telegram, the same bot and chat that home-docker's Uptime Kuma alerts to
# (kcfam status page). Both values come from the gtfs-app-secrets Secret as env;
# Gatus substitutes ${VAR} at load time.
#
# `default-alert` is a template, NOT an opt-out: an endpoint only alerts if it
# also carries `alerts: - type: telegram`. Verified against v5.36.0; with the
# template alone and no per-endpoint block, nothing is ever sent.
alerting:
  telegram:
    token: "${TELEGRAM_BOT_TOKEN}"
    id: "${TELEGRAM_CHAT_ID}"
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

ui:
  title: gtfs.zone status
  header: gtfs.zone
  description: Live status of the gtfs.zone GTFS-RT stack.
  link: https://gtfs.zone

endpoints:
  # ── Feed ────────────────────────────────────────────────────────────────────
  - name: GTFS-RT API
    group: Feed
    url: https://rt.gtfs.zone/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      # cert-manager renews at 30d; alert well before the edge serves a dead cert.
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: telegram

  - name: Amtrak vehicle positions
    group: Feed
    url: https://rt.gtfs.zone/amtrak/vehicle_positions.json
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].header.gtfsRealtimeVersion == 2.0"
      - "len([BODY].entity) > 0"
    alerts:
      - type: telegram
        # An empty feed at 03:00 is plausible, a stalled producer is not.
        # 30 x 120s means an hour of continuous emptiness before it pages.
        failure-threshold: 30

  - name: Amtrak trip updates
    group: Feed
    url: https://rt.gtfs.zone/amtrak/trip_updates.json
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      # Empty here is the rt-delay-estimator failure mode: positions fine, delays gone.
      - "len([BODY].entity) > 0"
    alerts:
      - type: telegram
        # An empty feed at 03:00 is plausible, a stalled producer is not.
        # 30 x 120s means an hour of continuous emptiness before it pages.
        failure-threshold: 30

  - name: Feed catalog
    group: Feed
    url: https://rt.gtfs.zone/feeds
    interval: 300s
    conditions:
      - "[STATUS] == 200"
      - "len([BODY]) > 0"
    alerts:
      - type: telegram

  # ── Sites ───────────────────────────────────────────────────────────────────
  - name: gtfs.zone
    group: Sites
    url: https://gtfs.zone/
    interval: 120s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: edit.gtfs.zone
    group: Sites
    url: https://edit.gtfs.zone/
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: telegram

  - name: viz.rt.gtfs.zone
    group: Sites
    url: https://viz.rt.gtfs.zone/
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      # Wildcards match one label, so this host rides the *.rt.gtfs.zone SAN.
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: telegram

  - name: list.gtfs.zone
    group: Sites
    url: https://list.gtfs.zone/
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: telegram

  # A feed page is the app shell with feed-catalog's fragments included over
  # SSI from Garage. Without the JSON-LD the include fell back to the home head.
  - name: list.gtfs.zone feed page
    group: Sites
    url: https://list.gtfs.zone/feed/f-1f748c5476/mbta
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*application/ld+json*)"
    alerts:
      - type: telegram

  - name: list.gtfs.zone sitemap
    group: Sites
    url: https://list.gtfs.zone/sitemap.xml
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*<urlset*)"
    alerts:
      - type: telegram

  # ── Auth ────────────────────────────────────────────────────────────────────
  - name: Keycloak realm
    group: Auth
    url: https://id.gtfs.zone/realms/gtfs
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].realm == gtfs"
    alerts:
      - type: telegram

  - name: oauth2-proxy
    group: Auth
    url: https://auth.gtfs.zone/ping
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: Manager (gated)
    group: Auth
    url: https://manage.rt.gtfs.zone/
    interval: 120s
    conditions:
      # 401 is the correct answer: it means ForwardAuth is still enforcing.
      - "[STATUS] == 401"
    alerts:
      - type: telegram

  - name: Dagster (gated)
    group: Auth
    url: https://dagster.gtfs.zone/
    interval: 120s
    conditions:
      # 401 means oauth2-proxy-admin is still enforcing the gtfs-admins gate.
      - "[STATUS] == 401"
    alerts:
      - type: telegram

  - name: ArgoCD
    group: Auth
    url: https://argocd.gtfs.zone/healthz
    interval: 120s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  # ── Ingest ──────────────────────────────────────────────────────────────────
  - name: Traccar console
    group: Ingest
    url: https://traccar.gtfs.zone/api/server
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: Traccar osmand port
    group: Ingest
    url: tcp://traccar-osmand.gtfs.svc.cluster.local:5055
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: rt-traccar-receiver
    group: Ingest
    url: http://rt-traccar-receiver.gtfs.svc.cluster.local:8080/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  # ── Data ────────────────────────────────────────────────────────────────────
  - name: Postgres
    group: Data
    url: tcp://postgres-rw.gtfs.svc.cluster.local:5432
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: Redis
    group: Data
    url: tcp://redis.gtfs.svc.cluster.local:6379
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: Garage S3
    group: Data
    url: tcp://garage.gtfs.svc.cluster.local:3900
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  # Served by Garage's web endpoint, so this also covers the public bucket's
  # Host-based routing. Freshness is the heartbeat below: conditions cannot
  # compare generated_at against the current time.
  - name: Catalog manifest
    group: Data
    url: https://data.gtfs.zone/manifest.json
    interval: 300s
    conditions:
      - "[STATUS] == 200"
      - "has([BODY].generated_at) == true"
      - "has([BODY].run_id) == true"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: telegram

  # Catches a run that publishes the manifest but not the feeds. Several MB, so
  # hourly rather than with the manifest.
  - name: Catalog feeds
    group: Data
    url: https://data.gtfs.zone/feeds.json
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "has([BODY].generated_at) == true"
      - "[BODY].count > 0"
    alerts:
      - type: telegram

  # ── DNS ─────────────────────────────────────────────────────────────────────
  - name: Porkbun record for rt.gtfs.zone
    group: DNS
    url: 1.1.1.1
    dns:
      query-name: rt.gtfs.zone
      query-type: A
    interval: 300s
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 73.4.232.254"
    alerts:
      - type: telegram

# Pushed, not polled: feed-catalog POSTs success to
# /api/v1/endpoints/data_catalog-publish/external after each publish. The
# pipeline runs daily at 09:00 UTC; 30h leaves room for a slow run. Storage is
# in-memory, so after a restart the first check is 30h out, by which time the
# next daily push has landed.
external-endpoints:
  - name: Catalog publish
    group: Data
    token: "${GATUS_FEED_CATALOG_TOKEN}"
    heartbeat:
      interval: 30h
    alerts:
      - type: telegram
        # Each miss is already a whole missed day.
        failure-threshold: 1

  # timetable-sites POSTs success to /api/v1/endpoints/data_sites-publish/external
  # once 95% of sites have been built for the day; the schedule runs at 11:00 UTC.
  - name: Sites publish
    group: Data
    token: "${GATUS_TIMETABLE_SITES_TOKEN}"
    heartbeat:
      interval: 30h
    alerts:
      - type: telegram
        failure-threshold: 1

  # Each rt-poller POSTs to /api/v1/endpoints/pollers_<name>/external every
  # cycle, throttled to one push per minute while unchanged: success when its
  # upstream answered (empty is fine), failure when it could not be read.
  # 5 failures is about 5 min of upstream errors; 5 missed 5m heartbeats is a
  # poller that has died or hung.
  - name: Amtrak poller
    group: Pollers
    token: "${GATUS_POLLERS_TOKEN}"
    heartbeat:
      interval: 5m
    alerts:
      - type: telegram
        failure-threshold: 5

  - name: Columbia County poller
    group: Pollers
    token: "${GATUS_POLLERS_TOKEN}"
    heartbeat:
      interval: 5m
    alerts:
      - type: telegram
        failure-threshold: 5

  - name: Hudson Link poller
    group: Pollers
    token: "${GATUS_POLLERS_TOKEN}"
    heartbeat:
      interval: 5m
    alerts:
      - type: telegram
        failure-threshold: 5

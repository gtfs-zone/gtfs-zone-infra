# GTFS-realtime feeds the rt-archive recorder polls and the TIDES build
# publishes to archive.rt.gtfs.zone. A feed is turned off with
# `enabled: false` and never deleted, so its partitions and packages stay.
#
# Per feed:
#   enabled            poll and build this feed
#   producer           stop_time_predictions.producer in the TIDES output
#   static             GTFS zip, checked on start and hourly
#   vehicle_positions  GTFS-RT URLs; service_alerts is optional
#   trip_updates
#   service_alerts
#   poll               seconds between polls (default 15)
#   build_lag_days     days after the service date the build waits (default 1)
#
# rt.gtfs.zone feeds are polled through the in-cluster gtfs-api Service. Their
# static zips are the upstream URLs: rt-api's /<feed>/gtfs.zip only serves
# hosted uploads and 404s for these url-sourced feeds.
feeds:
  amtrak:
    enabled: true
    producer: rt.gtfs.zone
    static: https://content.amtrak.com/content/gtfs/GTFS.zip
    vehicle_positions: http://gtfs-api:8000/amtrak/vehicle_positions.pb
    trip_updates: http://gtfs-api:8000/amtrak/trip_updates.pb
    service_alerts: http://gtfs-api:8000/amtrak/service_alerts.pb
    # Amtrak trips span up to ~2 days.
    build_lag_days: 3
  columbia-county:
    enabled: true
    producer: rt.gtfs.zone
    static: https://raw.githubusercontent.com/columbia-county-ny-transit/gtfs-generator/refs/heads/main/columbia_county_gtfs.zip
    vehicle_positions: http://gtfs-api:8000/columbia-county/vehicle_positions.pb
    trip_updates: http://gtfs-api:8000/columbia-county/trip_updates.pb
    service_alerts: http://gtfs-api:8000/columbia-county/service_alerts.pb
  hudsonlink:
    enabled: true
    producer: rt.gtfs.zone
    static: https://s3.amazonaws.com/datatools-511ny/public/Hudson_Link.zip
    vehicle_positions: http://gtfs-api:8000/hudsonlink/vehicle_positions.pb
    trip_updates: http://gtfs-api:8000/hudsonlink/trip_updates.pb
    service_alerts: http://gtfs-api:8000/hudsonlink/service_alerts.pb
  suntran:
    enabled: true
    producer: suntran
    static: https://GTFS-RT.suntran.com/TMGTFSRealTimeWebService/Static/SunTranGTFS.zip
    vehicle_positions: https://GTFS-RT.suntran.com/TMGTFSRealTimeWebService/Vehicle/VehiclePositions.pb
    trip_updates: https://GTFS-RT.suntran.com/TMGTFSRealTimeWebService/TripUpdate/TripUpdates.pb
    service_alerts: https://GTFS-RT.suntran.com/TMGTFSRealTimeWebService/Alert/Alerts.pb

# ── rt-pollers (external feed pollers) ────────────────────────────────────────
# Three Deployments off one image, one per SOURCE. Each polls an upstream operator
# feed and POSTs to rt-api's /ingest/* with a shared bearer token; they do NOT
# go through Traccar or Redis directly.
#
#   amtrak    → Amtrak's getTrainsData blob
#   buswhere  → Columbia County's buswhere API + its published GTFS
#   hudsonlink → CoachUSA's journey API for Hudson Link + its 511NY GTFS
#
# INGEST_TRACKER_ID must equal a provisioned Tracker.id in the target feed: the
# opaque uuid4 hex surrogate key, never the human-readable device_key. rt-api
# reads the live keyspace as `vehicle:{tracker_id}[:{vehicle_id}]` and
# /ingest/alerts rejects an id it cannot resolve, so a mismatch loses positions
# and trip updates silently and only alerts 403. INGEST_VEHICLE_ID is the old
# name for the same value; both are set here so a rollback to an image that
# only reads the old name keeps working. Read the current values from the live
# database, not from memory:
#
#   kubectl -n gtfs exec postgres-1 -- \
#     psql -U postgres -d rt_api -c "select id, device_key, nickname from tracker"
#
# Re-provisioning a tracker mints a new id, so these have to be re-read then.
#
# Deliberately NO PersistentVolumeClaim on /app/beat. The image creates and chowns
# that directory for the non-root `bridge` user at build time; mounting a volume
# over it masks the chown and the poller dies with PermissionError writing
# gtfs_cache.zip. The only thing living there is a re-downloadable GTFS cache, so
# the image's own directory is both simpler and safer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rt-pollers-amtrak
  namespace: gtfs
  labels:
    app: rt-pollers-amtrak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rt-pollers-amtrak
  template:
    metadata:
      labels:
        app: rt-pollers-amtrak
    spec:
      containers:
        - name: rt-pollers
          image: ghcr.io/gtfs-zone/gtfs-zone-rt-pollers:v0.2.0
          env:
            - name: SOURCE
              value: amtrak
            - name: POLL_INTERVAL
              value: "15"
            - name: INGEST_TRACKER_ID
              # Tracker.id for device_key amtrak-live.
              value: fbacbb1b6c1cfc37a37342f5db7b1f14
            - name: INGEST_VEHICLE_ID
              value: fbacbb1b6c1cfc37a37342f5db7b1f14
            - name: RT_API_INGEST_URL
              value: http://gtfs-api:8000
            - name: INGEST_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: INGEST_API_TOKEN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rt-pollers-buswhere
  namespace: gtfs
  labels:
    app: rt-pollers-buswhere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rt-pollers-buswhere
  template:
    metadata:
      labels:
        app: rt-pollers-buswhere
    spec:
      containers:
        - name: rt-pollers
          image: ghcr.io/gtfs-zone/gtfs-zone-rt-pollers:v0.2.0
          env:
            - name: SOURCE
              value: buswhere
            - name: INGEST_TRACKER_ID
              # Tracker.id for device_key columbia-county.
              value: eac865d0127347eccc850b894baa6048
            - name: INGEST_VEHICLE_ID
              value: eac865d0127347eccc850b894baa6048
            # The raw.githubusercontent.com host, not github.com/.../raw/, the
            # latter 302s and rt-pollers' httpx client does not follow redirects.
            - name: GTFS_URL
              value: https://raw.githubusercontent.com/columbia-county-ny-transit/gtfs-generator/refs/heads/main/columbia_county_gtfs.zip
            - name: RT_API_INGEST_URL
              value: http://gtfs-api:8000
            - name: INGEST_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: INGEST_API_TOKEN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rt-pollers-hudsonlink
  namespace: gtfs
  labels:
    app: rt-pollers-hudsonlink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rt-pollers-hudsonlink
  template:
    metadata:
      labels:
        app: rt-pollers-hudsonlink
    spec:
      containers:
        - name: rt-pollers
          image: ghcr.io/gtfs-zone/gtfs-zone-rt-pollers:v0.3.0
          env:
            - name: SOURCE
              value: hudsonlink
            - name: INGEST_TRACKER_ID
              # Tracker.id for the hudsonlink feed's "Hudson Link" tracker.
              value: bf1d947a25ef451fb579867d93b60765
            - name: RT_API_INGEST_URL
              value: http://gtfs-api:8000
            - name: INGEST_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: INGEST_API_TOKEN

# ── rt-api ────────────────────────────────────────────────────────────────────
# The single rt-api image runs as two Deployments, matching the TF split:
#   gtfs-api      (:8000, public)  : unauthenticated GTFS-RT feed at rt.gtfs.zone
#   gtfs-manager  (:8001, admin)   : oauth2-protected UI at manage.rt.gtfs.zone
# Shared env mirrors the TF `local.rt_api_env`. The DATABASE_URL password is
# injected via a dependent env var ($(POSTGRES_RT_API_PASSWORD)); Postgres host is
# CNPG's read-write Service `postgres-rw`. Alembic migrations run separately as the
# PreSync Job in rt-api-migrate.yaml. The `/run/nanomq` shared volume is gone with
# the MQTT drop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtfs-api
  namespace: gtfs
  labels:
    app: gtfs-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gtfs-api
  template:
    metadata:
      labels:
        app: gtfs-api
    spec:
      containers:
        - name: gtfs-api
          image: ghcr.io/gtfs-zone/gtfs-zone-rt-api:v0.4.0
          command: ["fastapi", "run", "src/gtfs_zone_rt_api/main.py", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/1
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/3
            - name: POSTGRES_RT_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-rt-api
                  key: password
            - name: DATABASE_URL
              value: postgresql://rt_api:$(POSTGRES_RT_API_PASSWORD)@postgres-rw:5432/rt_api
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: SESSION_SECRET_KEY
            # Traccar device provisioning. rt-api auto-creates a Traccar device
            # per Tracker over REST using the admin account, and bakes
            # TRACCAR_CLIENT_BASE into the org.traccar.client://config deep link
            # it renders as a QR, so that URL must be reachable from the driver's
            # phone, not just from inside the cluster.
            - name: TRACCAR_URL
              value: http://traccar:8082
            - name: TRACCAR_CLIENT_BASE
              value: https://traccar.gtfs.zone/osmand
            - name: TRACCAR_EMAIL
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: TRACCAR_ADMIN_EMAIL
            - name: TRACCAR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: TRACCAR_ADMIN_PASSWORD
            # Shared bearer guarding /ingest/* (rt-pollers is the producer).
            - name: INGEST_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: INGEST_API_TOKEN
            # Everything this app serves is public read-only data (the GTFS-RT
            # feeds and the /feeds catalog), so any browser origin may read it.
            # Safe as a wildcard: the CORS middleware allows GET only and sends
            # no credentials, and /ingest/* is POST behind a bearer token, so a
            # cross-origin call to it never gets past preflight.
            # Object storage for uploaded GTFS zips. garage-init imports this
            # key and grants it read/write on the bucket.
            - name: S3_ENDPOINT
              value: http://garage:3900
            - name: S3_BUCKET
              value: gtfs-feeds
            - name: S3_REGION
              value: garage
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: S3_SECRET_KEY
            - name: CORS_ALLOWED_ORIGINS
              value: '["*"]'
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gtfs-api
  namespace: gtfs
spec:
  selector:
    app: gtfs-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtfs-manager
  namespace: gtfs
  labels:
    app: gtfs-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gtfs-manager
  template:
    metadata:
      labels:
        app: gtfs-manager
    spec:
      containers:
        - name: gtfs-manager
          image: ghcr.io/gtfs-zone/gtfs-zone-rt-api:v0.4.0
          command:
            - fastapi
            - run
            - src/gtfs_zone_rt_api/admin_main.py
            - --port
            - "8001"
            - --proxy-headers
            - --forwarded-allow-ips=*
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: REDIS_URL
              value: redis://redis:6379/1
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/3
            - name: POSTGRES_RT_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-rt-api
                  key: password
            - name: DATABASE_URL
              value: postgresql://rt_api:$(POSTGRES_RT_API_PASSWORD)@postgres-rw:5432/rt_api
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: SESSION_SECRET_KEY
            # Traccar device provisioning. rt-api auto-creates a Traccar device
            # per Tracker over REST using the admin account, and bakes
            # TRACCAR_CLIENT_BASE into the org.traccar.client://config deep link
            # it renders as a QR, so that URL must be reachable from the driver's
            # phone, not just from inside the cluster.
            - name: TRACCAR_URL
              value: http://traccar:8082
            - name: TRACCAR_CLIENT_BASE
              value: https://traccar.gtfs.zone/osmand
            - name: TRACCAR_EMAIL
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: TRACCAR_ADMIN_EMAIL
            - name: TRACCAR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: TRACCAR_ADMIN_PASSWORD
            # Shared bearer guarding /ingest/* (rt-pollers is the producer).
            - name: INGEST_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: INGEST_API_TOKEN
            # /account asks Keycloak which upstream providers are linked to the
            # signed-in realm account (a login only reveals the one broker it
            # came through). Admin REST goes to the in-cluster Service; the
            # account-console link the page renders must be the browser-facing
            # issuer URL. Read-only service account: view-users, nothing more.
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_REALM
              value: gtfs
            - name: KEYCLOAK_CLIENT_ID
              value: rt-api
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: KEYCLOAK_RT_API_CLIENT_SECRET
            - name: KEYCLOAK_ACCOUNT_URL
              value: https://id.gtfs.zone/realms/gtfs/account
            # Object storage for uploaded GTFS zips. garage-init imports this
            # key and grants it read/write on the bucket.
            - name: S3_ENDPOINT
              value: http://garage:3900
            - name: S3_BUCKET
              value: gtfs-feeds
            - name: S3_REGION
              value: garage
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: S3_SECRET_KEY
            - name: CORS_ALLOWED_ORIGINS
              value: '["https://manage.rt.gtfs.zone","https://rt.gtfs.zone"]'
---
apiVersion: v1
kind: Service
metadata:
  name: gtfs-manager
  namespace: gtfs
spec:
  selector:
    app: gtfs-manager
  ports:
    - name: http
      port: 8001
      targetPort: http

# ── Garage ────────────────────────────────────────────────────────────────────
# S3-compatible object storage, holding the GTFS zips somebody uploads through
# manage.rt.gtfs.zone. rt-api writes and reads them; static-importer reads
# them to load the schedule. Both talk the S3 API, not Garage's own, so this can
# be swapped for AWS, R2 or B2 by changing S3_ENDPOINT alone.
#
# A StatefulSet rather than a Deployment: the metadata directory holds the
# node's identity, so the pod has to come back as the same node, and a rolling
# replacement that ran two pods against one RWO volume would corrupt it.
#
# `garage-init` is what makes this usable. Garage refuses every S3 call until a
# layout is applied, with a 500 that never mentions layouts, so the layout, the
# bucket and the access key are applied by a Job rather than left to whoever
# notices uploads are failing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: gtfs
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"

    # One replica because there is one node. Raising this needs more nodes
    # first; Garage refuses to start with a factor it cannot satisfy.
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "garage-0.garage.gtfs.svc.cluster.local:3901"

    [s3_api]
    # Part of the SigV4 signature, so it must match S3_REGION in every app that
    # talks to this bucket. A mismatch is a 403, not a redirect.
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.internal"

    # Static web serving, which is what makes data.gtfs.zone a public HTTP
    # endpoint rather than an S3 API only reachable with a signed request.
    # Garage picks the bucket from the Host header: a Host that does not end in
    # root_domain is looked up as a global alias, which is why the public
    # bucket is aliased literally `data.gtfs.zone`.
    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.internal"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"

  # The init script, run by the Job below. Driven through Garage's admin API
  # rather than its CLI: the garage image is a single static binary with no
  # shell, and the alternative is maintaining a second image for six calls.
  # Every step checks before it acts, because the Job re-runs on any resync and
  # applying a layout twice is not a no-op.
  init.sh: |
    #!/bin/sh
    set -eu

    ADMIN="http://garage:3903/v2"
    CAPACITY="${GARAGE_CAPACITY_BYTES:-40000000000}"

    # One line per bucket:
    #   <bucket> <key name> <access key env> <secret key env> <website> <owner>
    # Each bucket gets its own key, so a compromised pipeline credential
    # reaches one bucket and not the other. `website yes` is what makes the
    # bucket readable over plain HTTP at its own hostname. `owner yes` lets the
    # key change that one bucket's config: Garage refuses PutBucketCors from a
    # key without it.
    BUCKETS="
    gtfs-feeds      gtfs            S3_ACCESS_KEY                 S3_SECRET_KEY                 no  no
    data.gtfs.zone  feed-catalog    FEED_CATALOG_S3_ACCESS_KEY    FEED_CATALOG_S3_SECRET_KEY    yes yes
    sites.gtfs.zone timetable-sites TIMETABLE_SITES_S3_ACCESS_KEY TIMETABLE_SITES_S3_SECRET_KEY yes no
    crimes.gtfs.zone crimes CRIMES_S3_ACCESS_KEY CRIMES_S3_SECRET_KEY yes no
    "

    api() {
      method="$1"; path="$2"; shift 2
      curl -sS -f -X "$method" \
        -H "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" \
        -H "Content-Type: application/json" \
        "${ADMIN}${path}" "$@"
    }

    echo "==> waiting for the garage node"
    i=0
    until api GET /GetClusterStatus >/dev/null 2>&1; do
      i=$((i + 1))
      [ "$i" -lt 120 ] || { echo "garage never answered"; exit 1; }
      sleep 1
    done

    # A node with no role is the only case that needs assigning. Staging a
    # change on a node that already has one leaves a pending layout version
    # that nothing ever applies.
    if [ "$(api GET /GetClusterLayout | jq '.roles | length')" -eq 0 ]; then
      echo "==> assigning the layout"
      node_id=$(api GET /GetClusterStatus | jq -r '.nodes[0].id')
      api POST /UpdateClusterLayout -d "$(jq -nc \
        --arg id "$node_id" --argjson cap "$CAPACITY" \
        '{roles:[{id:$id,zone:"gtfs",capacity:$cap,tags:[]}]}')" >/dev/null
      # Apply targets the next version, so it is read back rather than assumed.
      next=$(( $(api GET /GetClusterLayout | jq '.version') + 1 ))
      api POST /ApplyClusterLayout -d "{\"version\":${next}}" >/dev/null
    else
      echo "==> layout already applied"
    fi

    echo "$BUCKETS" | while read -r BUCKET KEY_NAME ACCESS_VAR SECRET_VAR WEBSITE OWNER; do
      [ -n "$BUCKET" ] || continue
      eval "ACCESS_KEY=\${${ACCESS_VAR}:?}"
      eval "SECRET_KEY=\${${SECRET_VAR}:?}"

      bucket_id=$(api GET /ListBuckets \
        | jq -r --arg b "$BUCKET" '.[] | select(.globalAliases[]? == $b) | .id')
      if [ -z "$bucket_id" ]; then
        echo "==> creating bucket ${BUCKET}"
        bucket_id=$(api POST /CreateBucket -d "$(jq -nc --arg b "$BUCKET" \
          '{globalAlias:$b}')" | jq -r '.id')
      else
        echo "==> bucket ${BUCKET} already exists"
      fi

      # Imported, not created: a created key is random, and the apps read theirs
      # from gtfs-app-secrets. Import is how a known pair gets in.
      if api GET "/GetKeyInfo?id=${ACCESS_KEY}" >/dev/null 2>&1; then
        echo "==> key ${KEY_NAME} already imported"
      else
        echo "==> importing key ${KEY_NAME}"
        api POST /ImportKey -d "$(jq -nc \
          --arg id "$ACCESS_KEY" --arg secret "$SECRET_KEY" --arg n "$KEY_NAME" \
          '{accessKeyId:$id,secretAccessKey:$secret,name:$n}')" >/dev/null
      fi

      # AllowBucketKey only sets the flags passed as true, so owner:false never
      # revokes an existing grant.
      echo "==> granting ${KEY_NAME} read/write (owner: ${OWNER}) on ${BUCKET}"
      api POST /AllowBucketKey -d "$(jq -nc \
        --arg b "$bucket_id" --arg id "$ACCESS_KEY" --arg o "$OWNER" \
        '{bucketId:$b,accessKeyId:$id,permissions:{read:true,write:true,owner:($o == "yes")}}')" \
        >/dev/null

      # Website access is what the s3_web endpoint serves from; without it a
      # GET on data.gtfs.zone is a 404 that never mentions the setting. The
      # CORS rule is set by feed-catalog, not here: it is an S3 call, and the
      # admin API has no equivalent. That is why feed-catalog's key is owner.
      if [ "$WEBSITE" = yes ]; then
        echo "==> enabling website access on ${BUCKET}"
        api POST "/UpdateBucket?id=${bucket_id}" -d "$(jq -nc \
          '{websiteAccess:{enabled:true,indexDocument:"index.html",errorDocument:"error.html"}}')" \
          >/dev/null
      fi
    done

    echo "==> garage is ready"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: gtfs
spec:
  # Headless, so garage-0 gets the stable DNS name rpc_public_addr claims.
  # Nothing load-balances across one node anyway.
  clusterIP: None
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: rpc
      port: 3901
      targetPort: rpc
    - name: web
      port: 3902
      targetPort: web
    - name: admin
      port: 3903
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: gtfs
  labels:
    app: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      # Garage writes as root in its image; the Longhorn volume mounts
      # root-owned, so nothing needs fixing up here. Kept explicit so a future
      # image that drops privileges fails visibly rather than silently.
      securityContext:
        fsGroup: 0
      containers:
        - name: garage
          image: dxflrs/garage:v2.1.0
          # The image has no entrypoint, only a command, so `args` alone would
          # replace the binary's path with "server" and fail to exec.
          command: ["/garage", "server"]
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
            # Kept out of the ConfigMap: it is the cluster join secret, not a
            # tuning knob. Garage reads both of these from the environment.
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GARAGE_RPC_SECRET
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GARAGE_ADMIN_TOKEN
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: web
              containerPort: 3902
            - name: admin
              containerPort: 3903
          volumeMounts:
            - name: config
              mountPath: /etc/garage
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
          readinessProbe:
            # A TCP check, not /health: /health 503s until a cluster layout
            # is applied, and that layout is applied by garage-init, an
            # ArgoCD PostSync hook that only runs once this StatefulSet is
            # Healthy. An HTTP check on /health would deadlock the first
            # bring-up. Ready here means reachable, not usable, which is all
            # garage-init needs.
            tcpSocket:
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 40Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
  namespace: gtfs
  annotations:
    # PostSync, not PreSync: it needs the StatefulSet running to talk to.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: alpine:3.21
          command: ["/bin/sh", "-c"]
          args:
            - apk add --no-cache curl jq >/dev/null && exec /bin/sh /etc/garage/init.sh
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GARAGE_RPC_SECRET
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GARAGE_ADMIN_TOKEN
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: S3_SECRET_KEY
            # feed-catalog's own pair, scoped to the public data.gtfs.zone
            # bucket so the pipeline cannot reach the private gtfs-feeds.
            - name: FEED_CATALOG_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: FEED_CATALOG_S3_ACCESS_KEY
            - name: FEED_CATALOG_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: FEED_CATALOG_S3_SECRET_KEY
            # timetable-sites' pair, scoped to the public sites.gtfs.zone bucket.
            - name: TIMETABLE_SITES_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: TIMETABLE_SITES_S3_ACCESS_KEY
            - name: TIMETABLE_SITES_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: TIMETABLE_SITES_S3_SECRET_KEY
            # crimes' pair, scoped to the crimes.gtfs.zone bucket.
            - name: CRIMES_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: CRIMES_S3_ACCESS_KEY
            - name: CRIMES_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: CRIMES_S3_SECRET_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/garage
      volumes:
        - name: config
          configMap:
            name: garage-config

## apps/infra-argocd-ingress.yaml: the ArgoCD UI's Certificate + IngressRoute
## (infra/argocd/manifests/).
##
## ArgoCD's own Helm release is NOT managed here; it was bootstrapped directly
## in Phase 2 and stays that way, so a broken sync can never take out the thing
## doing the syncing. Only these two ingress objects are GitOps-managed.
##
## Wave 3: after infra-cert-manager-config (wave 2) has created the
## `letsencrypt` ClusterIssuer this Certificate references, and after
## infra-traefik (wave 1) has installed the IngressRoute CRD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-argocd-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gtfs-zone/gtfs-zone-infra.git
    targetRevision: main
    path: infra/argocd/manifests
    directory:
      recurse: false
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

## apps/infra-external-dns.yaml: external-dns with the Cloudflare provider.
##
## Watches Traefik IngressRoutes and manages *.gtfs.zone records in Cloudflare. Wave 1
## needs Traefik's IngressRoute CRD present to watch. Stays CrashLoop/Pending
## until the Cloudflare token Secret exists.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns
      chart: external-dns
      targetRevision: 1.16.1
      helm:
        valueFiles:
          - $values/infra/external-dns/values.yaml
    - repoURL: https://github.com/gtfs-zone/gtfs-zone-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

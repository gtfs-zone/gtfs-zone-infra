## apps/infra-cert-manager-config.yaml: cert-manager configuration objects:
## the Let's Encrypt `ClusterIssuer` (Cloudflare DNS-01) and the `*.gtfs.zone`
## `Certificate` (raw manifests under infra/cert-manager/manifests/).
##
## Wave 2: after cert-manager's CRDs exist. The Certificate targets the `gtfs`
## namespace (CreateNamespace makes it early).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gtfs-zone/gtfs-zone-infra.git
    targetRevision: main
    path: infra/cert-manager/manifests
    directory:
      recurse: false
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: gtfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

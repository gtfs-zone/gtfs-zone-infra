## infra/traefik/values.yaml: Helm values for the Traefik chart.
##
## This is the host's edge: k3s ServiceLB (klipper) binds the LoadBalancer
## Service ports on the node, `web` on :80 (redirects to https) and `websecure`
## on :443. It terminates TLS for gtfs.zone and kcfam.us.
##   - No ACME here; certificates come from cert-manager (DNS-01) as Secrets.

deployment:
  kind: Deployment
  replicas: 1

ports:
  web:
    exposedPort: 80
    expose:
      default: true
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true
    tls:
      enabled: true
  # Internal dashboard/ping entrypoint, never exposed on the host.
  traefik:
    expose:
      default: false

service:
  type: LoadBalancer

providers:
  # Our routing is driven by IngressRoute / Middleware CRDs (Phase 7).
  kubernetesCRD:
    enabled: true
    # Allow IngressRoutes to reference Middlewares/TLS Secrets across namespaces
    # (e.g. the argocd route lives in the argocd namespace).
    allowCrossNamespace: true
    # kcfam.us routes to Docker services on the host (home/docker-apps in
    # maxtkc/kcfam-infra) through ExternalName Services with an IP.
    allowExternalNameServices: true
  # We do not use plain Ingress objects.
  kubernetesIngress:
    enabled: false

# No built-in dashboard IngressRoute; we add routes explicitly where wanted.
ingressRoute:
  dashboard:
    enabled: false

logs:
  general:
    level: INFO

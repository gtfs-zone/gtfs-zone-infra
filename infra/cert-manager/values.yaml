## infra/cert-manager/values.yaml: Helm values for the cert-manager chart.
##
## Operator + CRDs. DNS-01 is solved by the built-in Cloudflare solver
## (manifests/clusterissuer.yaml).
crds:
  # Install and manage the cert-manager CRDs via the chart.
  enabled: true
  # Don't delete CRDs (and issued-cert state) if the release is removed.
  keep: true

## infra/cert-manager/manifests/certificate.yaml
##
## Wildcard cert for the gtfs stack. The resulting `gtfs-zone-tls` Secret lives in
## the `gtfs` namespace so the app's IngressRoutes (Phase 7) can reference it.
##
## Two SANs, and both are load-bearing:
##
##   *.gtfs.zone     rt · id · auth · uptime · status · traccar
##   *.rt.gtfs.zone  manage.rt.gtfs.zone
##
## A DNS wildcard matches exactly ONE label, so `*.gtfs.zone` does NOT cover
## `manage.rt.gtfs.zone`: without the second SAN that route serves a cert whose
## names don't match and every browser rejects it.
##
## The bare apex `gtfs.zone` is deliberately NOT here: GitHub Pages serves it,
## and nothing in k3s does.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gtfs-zone-tls
  namespace: gtfs
spec:
  secretName: gtfs-zone-tls
  dnsNames:
    - "*.gtfs.zone"
    - "*.rt.gtfs.zone"
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer

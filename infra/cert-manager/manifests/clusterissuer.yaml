## infra/cert-manager/manifests/clusterissuer.yaml
##
## Let's Encrypt production issuer that solves DNS-01 challenges through
## cert-manager's built-in Cloudflare solver. The token comes from the
## `cloudflare-api-token` Secret in the cert-manager namespace
## (infra/secrets/cloudflare-cert-manager.enc.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: maxkatzchristy@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token

## infra/external-dns/values.yaml: Helm values for the kubernetes-sigs
## external-dns chart, using the built-in Cloudflare provider.
##
## Sources are Traefik IngressRoutes (traefik-proxy) and DNSEndpoints (crd).
## Each gtfs IngressRoute carries an `external-dns.alpha.kubernetes.io/target:
## <server_ip>` annotation; DNSEndpoints cover records with no IngressRoute
## behind them (sites/pages-dns.yaml). Records are DNS-only unless an endpoint
## sets `external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"`.
##
## The token comes from the `cloudflare-api-token` Secret in the external-dns
## namespace (infra/secrets/cloudflare-external-dns.enc.yaml).
provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: CF_API_TOKEN

# Only manage records under gtfs.zone.
domainFilters:
  - gtfs.zone

# Watch Traefik IngressRoutes and DNSEndpoints (adds the needed RBAC).
sources:
  - traefik-proxy
  - crd

# The traefik-proxy source watches BOTH the modern `traefik.io` API group and the
# legacy `traefik.containo.us` one. Traefik v3 (chart 35.x) only ships the former,
# so external-dns blocks forever waiting for a cache sync on a CRD that does not
# exist and dies with:
#   fatal: failed to sync traefik.containo.us/v1alpha1, Resource=ingressrouteudps
# Disabling the legacy group is required, not cosmetic.
extraArgs:
  - --traefik-disable-legacy
  # Only write the typed ownership TXT (`cname-edit`, `a-list`, ...). The legacy
  # one sits at the record's own name, which a CNAME cannot share.
  - --txt-new-format-only

# Full ownership: create AND delete records to match cluster state, tagged with a
# TXT owner record so external-dns only touches records it created.
#
# The apex records (GitHub Pages' A/AAAA set), MX, SPF/verification TXT, `www` and
# the GitHub Pages challenge TXT are kept by hand in Cloudflare. They carry no
# ownership TXT and nothing in the cluster declares them, so `sync` leaves them alone.
policy: sync
registry: txt
txtOwnerId: gtfs-k3s

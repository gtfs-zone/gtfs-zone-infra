# KSOPS generator: decrypts the SOPS-encrypted Secret manifests below at
# `kustomize build` time (run by ArgoCD's ksops CMP sidecar). Each listed file is
# a full Secret manifest that is emitted verbatim once decrypted.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./porkbun-cert-manager.enc.yaml
  - ./cloudflare-external-dns.enc.yaml
  - ./argocd-oidc.enc.yaml

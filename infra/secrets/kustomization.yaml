# infra/secrets: DNS provider credentials for cert-manager + external-dns, and
# the Keycloak OIDC client secret argocd-server reads for SSO.
#
# Rendered by ArgoCD's KSOPS CMP (the presence of *.enc.yaml here triggers the
# ksops plugin, which runs `kustomize build --enable-alpha-plugins --enable-exec`).
# Each Secret carries its own explicit namespace, so no namespace is set here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generators:
  - ./secret-generator.yaml

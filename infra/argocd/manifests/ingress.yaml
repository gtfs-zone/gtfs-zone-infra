## infra/argocd/manifests/ingress.yaml: public access to the ArgoCD UI.
##
## ArgoCD lives in the `argocd` namespace, so it cannot reuse the `gtfs-zone-tls`
## Secret that cert-manager issues into `gtfs` (Secrets do not cross namespaces).
## Rather than mirror that Secret with a third-party reflector, we issue a second,
## narrower Certificate for just this hostname from the same ClusterIssuer.
##
## ArgoCD itself was bootstrapped with Helm directly (Phase 2), not through the
## app-of-apps; only these two ingress objects are GitOps-managed, via
## apps/infra-argocd-ingress.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-gtfs-zone-tls
  namespace: argocd
spec:
  secretName: argocd-gtfs-zone-tls
  dnsNames:
    - "argocd.gtfs.zone"
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
---
## Mirrors the seven routes in gtfs/ingressroutes.yaml: `websecure` entrypoint
## (host :8443 via ServiceLB, reached through home-docker Traefik's SNI
## passthrough for *.gtfs.zone), and the external-dns target annotation that
## creates the Cloudflare record.
##
## Backend port 80 (not 443): `server.insecure: true` in infra/argocd/values.yaml
## makes argocd-server serve plain HTTP, so TLS terminates here at Traefik.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd.gtfs.zone`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: argocd-gtfs-zone-tls

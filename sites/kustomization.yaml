# sites: the nginx-served sites (list, manage.rt, crimes) and the DNS records for the
# sites GitHub Pages serves (gtfs.zone's subdomains in pages-dns.yaml). Each
# nginx site is an immutable image served by its own Deployment.
#
# No secrets in this tree, so no KSOPS: the `sites` ArgoCD Application uses a
# plain Kustomize source.
#
# The `images:` block below is the deploy trigger. Each site's CI, after pushing
# a new image, runs
#   kustomize edit set image ghcr.io/gtfs-zone/<repo>=ghcr.io/gtfs-zone/<repo>@sha256:<digest>
# in this directory and commits, so what is deployed is always a digest recorded
# in git. `newTag` is only the human-readable starting point; once CI has run at
# least once these entries carry digests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- pages-dns.yaml
- rt-manager.yaml
- feed-list.yaml
- crimes.yaml
images:
- digest: sha256:0e6ae3536a04b68e7aa11af99ac4843294e3328ff07ec6a2b72efda7b9a92b23
  name: ghcr.io/gtfs-zone/gtfs-zone-crimes-web
  newName: ghcr.io/gtfs-zone/gtfs-zone-crimes-web
- digest: sha256:a4e54b02f02030b29663e22d3b9a9f129892d981fc07eccdaba4fdaad8506fb5
  name: ghcr.io/gtfs-zone/gtfs-zone-feed-list
  newName: ghcr.io/gtfs-zone/gtfs-zone-feed-list
- digest: sha256:7797589794acb512d489d363624cdf0f7d6ec8aada9be0118324e798df52b4c5
  name: ghcr.io/gtfs-zone/gtfs-zone-rt-manager
  newName: ghcr.io/gtfs-zone/gtfs-zone-rt-manager
